[project]
name = "kawkit-worker"
version = "0.1.0"
description = "Kawkit model worker: pulls runs from the Supabase queue and fits a Bayesian MMM"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "pymc-marketing>=0.15",
    "pymc>=5.20",
    "nutpie>=0.14",
    "arviz>=0.20",
    "pandas>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kawkit_worker"]

[tool.pytest.ini_options]
markers = ["slow: known-truth model tests (minutes)", "integration: needs a live Supabase project", "load: needs a live project and a running worker"]
addopts = "-m 'not slow and not integration and not load'"

[tool.ruff]
line-length = 190

[tool.ruff.lint]
select = ["E", "F", "I"]
